<text x="22" y="30" font-size="15" font-weight="700" fill="#0f172a">From a fixed pipeline to a decision loop</text>
<text x="22" y="56" font-size="12" font-weight="700" fill="#64748b">SESSION 2 — fixed pipeline (you decide, every time)</text><rect x="40" y="74" width="120" height="44" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="100.0" y="96.0" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">question</text><line x1="160" y1="96" x2="210" y2="96" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah1)"/><rect x="210" y="74" width="120" height="44" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="270.0" y="96.0" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle" dominant-baseline="middle">retrieve</text><line x1="330" y1="96" x2="380" y2="96" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah1)"/><rect x="380" y="74" width="120" height="44" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="440.0" y="96.0" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">answer</text><text x="582" y="101" font-size="12" fill="#64748b">always · in order</text><line x1="22" y1="150" x2="738" y2="150" stroke="#e2e8f0"/><text x="22" y="174" font-size="12" font-weight="700" fill="#64748b">SESSION 3 — the agent loop (the model decides)</text><rect x="34" y="258" width="104" height="46" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="281.0" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">question</text><line x1="138" y1="281" x2="182" y2="281" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah1)"/><rect x="182" y="258" width="116" height="46" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="240.0" y="281.0" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">MODEL</text><line x1="298" y1="281" x2="347" y2="281" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah1)"/><polygon points="406,244.0 465.0,281 406,318.0 347.0,281" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="406.0" y="274.0" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle" dominant-baseline="middle">tool</text><text x="406.0" y="288.0" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle" dominant-baseline="middle">call?</text><rect x="356" y="180" width="120" height="36" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="416.0" y="198.0" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle" dominant-baseline="middle">tool</text><line x1="406" y1="244" x2="414" y2="218" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah1)"/><text x="452" y="232" font-size="11" fill="#64748b" text-anchor="middle">yes</text><path d="M356,198 C295,190 212,236 210,256" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah1)"/><text x="236" y="188" font-size="11" fill="#64748b" text-anchor="middle">result</text><rect x="500" y="258" width="170" height="46" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="585.0" y="281.0" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="middle">final answer</text><line x1="465" y1="281" x2="500" y2="281" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah1)"/><text x="482.5" y="272" font-size="11" fill="#64748b" text-anchor="middle">no</text>
