<text x="22" y="56" font-size="12" fill="#64748b">The model never runs your code — it <tspan font-weight="700">requests</tspan> a call, your harness runs it.</text><rect x="60" y="90" width="150" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="135.0" y="125.0" font-size="14" font-weight="600" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">MODEL</text><line x1="300" y1="72" x2="300" y2="250" stroke="#e2e8f0" stroke-dasharray="4 4"/><text x="300" y="86" font-size="10.5" fill="#64748b" text-anchor="middle">tool boundary</text><rect x="430" y="78" width="150" height="36" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="505.0" y="96.0" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle" dominant-baseline="middle">search_wellness…</text><rect x="430" y="122" width="150" height="36" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="505.0" y="140.0" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle" dominant-baseline="middle">hydration_calc</text><rect x="430" y="166" width="150" height="36" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="505.0" y="184.0" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle" dominant-baseline="middle">get_current_time</text><line x1="210" y1="112" x2="430" y2="96" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah2)"/><text x="320" y="96" font-size="11" fill="#64748b" text-anchor="middle">requests a call</text><line x1="430" y1="184" x2="210" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah2)"/><text x="320" y="182" font-size="11" fill="#64748b" text-anchor="middle">returns result</text><rect x="40" y="185" width="230" height="56" rx="12" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="205.8" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="middle">what the model sees:</text><text x="155.0" y="220.2" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="middle">name · docstring · input schema</text><text x="505" y="232" font-size="11" fill="#64748b" text-anchor="middle">your system (tools)</text>
