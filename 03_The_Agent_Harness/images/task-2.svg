<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" style="max-width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="The harness with no framework: a Python function, a JSON schema, and your loop">
<defs><marker id="ah2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="22" y="30" font-size="15" font-weight="700" fill="#0f172a">The harness with no framework</text>
<text x="22" y="52" font-size="12" fill="#64748b">A tool is a Python function plus a JSON schema the model reads &#8212; and the loop is yours to write.</text>

<!-- A: Python function -->
<text x="26" y="84" font-size="10" fill="#64748b">your Python function</text>
<rect x="24" y="90" width="196" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="113" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#334155">def hydration(kg):</text>
<text x="34" y="131" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#334155">    return f"{35*kg} ml"</text>

<!-- arrow A -> B -->
<line x1="220" y1="119" x2="262" y2="119" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="241" y="110" font-size="10" fill="#64748b" text-anchor="middle">describe</text>

<!-- B: JSON schema -->
<text x="264" y="84" font-size="10" fill="#64748b">the schema the model sees</text>
<rect x="262" y="90" width="214" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="272" y="108" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#3730a3">{ "name": "hydration",</text>
<text x="272" y="123" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#3730a3">  "description": "...",</text>
<text x="272" y="138" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#3730a3">  "parameters": {...} }</text>

<!-- arrow B -> model -->
<line x1="476" y1="119" x2="520" y2="119" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="498" y="110" font-size="10" fill="#64748b" text-anchor="middle">sent to</text>

<!-- model pill -->
<rect x="520" y="97" width="96" height="44" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="568" y="119" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle" dominant-baseline="middle">model</text>

<!-- model -> answer -->
<line x1="616" y1="119" x2="662" y2="119" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="639" y="110" font-size="10" fill="#64748b" text-anchor="middle">text</text>
<rect x="662" y="100" width="84" height="38" rx="19" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="704" y="119" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" dominant-baseline="middle">answer</text>

<!-- the loop: model <-> run the tool -->
<rect x="420" y="178" width="176" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="508" y="198" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#065f46" text-anchor="middle" dominant-baseline="middle">json.loads() &#8594; run it</text>
<path d="M548,141 C540,158 520,164 512,178" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="452" y="162" font-size="10" fill="#64748b" text-anchor="middle">tool call (JSON)</text>
<path d="M568,178 C576,164 586,158 582,141" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="612" y="166" font-size="10" fill="#64748b" text-anchor="middle">result, loop</text>
</svg>
