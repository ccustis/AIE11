<text x="22" y="56" font-size="12" fill="#64748b">The agent decides <tspan font-weight="700">whether</tspan> to retrieve — retrieval is now a tool, not a required step.</text><rect x="34" y="150" width="64" height="40" rx="20.0" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/><text x="66.0" y="170.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="middle">user</text><line x1="98" y1="170" x2="138" y2="170" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah5)"/><rect x="138" y="146" width="130" height="50" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="203.0" y="163.2" font-size="12.5" font-weight="600" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">WELLNESS</text><text x="203.0" y="178.8" font-size="12.5" font-weight="600" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">AGENT</text><polygon points="360,123.0 425.0,171 360,219.0 295.0,171" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="360.0" y="164.0" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle" dominant-baseline="middle">what kind of</text><text x="360.0" y="178.0" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle" dominant-baseline="middle">question?</text><line x1="268" y1="171" x2="295" y2="171" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah5)"/><line x1="425" y1="171" x2="486" y2="107" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah5)"/><text x="455" y="96" font-size="11" fill="#64748b" text-anchor="middle">wellness</text><rect x="486" y="86" width="180" height="42" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="576.0" y="107.0" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle" dominant-baseline="middle">search_wellness…</text><line x1="425" y1="171" x2="486" y2="171" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah5)"/><text x="455" y="160" font-size="11" fill="#64748b" text-anchor="middle