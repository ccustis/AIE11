<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" style="max-width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="LangGraph 101 — state, nodes, edges">
<defs><marker id="ah7" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="288" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="22" y="30" font-size="15" font-weight="700" fill="#0f172a">LangGraph 101 — state, nodes, edges</text>
<text x="22" y="56" font-size="12" fill="#64748b">A graph moves <tspan font-weight="700">state</tspan> through <tspan font-weight="700">nodes</tspan>, wired by <tspan font-weight="700">edges</tspan>.</text><rect x="44" y="96" width="80" height="42" rx="21.0" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/><text x="84.0" y="117.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="middle">START</text><line x1="124" y1="117" x2="180" y2="117" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah7)"/><text x="152.0" y="108" font-size="11" fill="#64748b" text-anchor="middle">state</text><rect x="180" y="94" width="150" height="46" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="255.0" y="109.5" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">node</text><text x="255.0" y="124.5" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">(a function)</text><line x1="330" y1="117" x2="392" y2="117" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah7)"/><text x="361.0" y="108" font-size="11" fill="#64748b" text-anchor="middle">updated state</text><rect x="392" y="96" width="80" height="42" rx="21.0" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/><text x="432.0" y="117.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="middle">END</text><path d="M300,140 C360,186 150,186 205,142" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah7)"/><text x="255" y="200" font-size="10.5" fill="#64748b" text-anchor="middle">edges can point back — that is how agents loop</text><rect x="44" y="214" width="428" height="40" rx="12" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/><text x="258.0" y="234.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="middle">State = a shared dict (our ‘messages’ list, appended by a reducer)</text>
</svg>
