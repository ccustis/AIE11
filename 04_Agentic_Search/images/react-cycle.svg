<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" style="max-width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="The ReAct loop: Reason, Act, Observe, repeat">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker></defs>
<rect x="1" y="1" width="758" height="328" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="22" y="30" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">The ReAct loop: Reason &#8594; Act &#8594; Observe</text><text x="22" y="52" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">The model thinks, calls a tool, reads the result &#8212; and repeats until it can answer.</text><text x="50" y="146" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">User</text><text x="50" y="161" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">question</text><line x1="92" y1="150" x2="111" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="111.0" y="122" width="128" height="56" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="175" y="143" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">Reason</text><text x="175" y="160" font-size="10.5" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">the model thinks</text><rect x="291.0" y="122" width="128" height="56" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="355" y="143" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle" dominant-baseline="middle">Act</text><text x="355" y="160" font-size="10.5" fill="#92400e" text-anchor="middle" dominant-baseline="middle">call a tool</text><rect x="471.0" y="122" width="128" height="56" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="535" y="143" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle" dominant-baseline="middle">Observe</text><text x="535" y="160" font-size="10.5" fill="#065f46" text-anchor="middle" dominant-baseline="middle">read the result</text><line x1="239" y1="150" x2="291" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="265.0" y="141" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">needs info</text><line x1="419" y1="150" x2="471" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><path d="M535,122 C535,90 175,90 175,122" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="355.0" y="84" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">repeat until it has enough to answer</text><rect x="634" y="130" width="108" height="40" rx="20" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/><text x="688" y="151" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Answer</text><line x1="599" y1="150" x2="634" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><text x="616.5" y="141" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">done</text><text x="22" y="232" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Tools the agent can call</text><path d="M355,178 C355,208 300,214 300,248" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#ahp)"/><text x="300" y="206" font-size="10" font-weight="400" fill="#6366f1" text-anchor="middle">invoke</text><path d="M470,248 C470,214 535,208 535,178" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#ahp)"/><text x="508" y="206" font-size="10" font-weight="400" fill="#6366f1" text-anchor="middle">observation</text><rect x="24.0" y="250" width="164.5" height="52" rx="12" fill="#6366f1"/><text x="106.2" y="276.0" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">search_wellness_knowledge</text><rect x="206.5" y="250" width="164.5" height="52" rx="12" fill="#6366f1"/><text x="288.8" y="276.0" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">hydration_calculator</text><rect x="389.0" y="250" width="164.5" height="52" rx="12" fill="#6366f1"/><text x="471.2" y="276.0" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">get_current_time</text><rect x="571.5" y="250" width="164.5" height="52" rx="12" fill="#6366f1"/><text x="653.8" y="276.0" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">web_search</text>
</svg>
